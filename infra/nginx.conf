# Agent System v2 — nginx static serve for the React SPA.
# Serves the Vite build output and falls back to index.html so client-side
# routes (Kanban board, ticket drawer, queue, run monitor) resolve correctly.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Don't cache the entry document so new deploys are picked up immediately.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Long-lived caching for fingerprinted static assets.
    location /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback: unknown paths return index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
